[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "axis-review"
version = "0.1.0"
description = "Multi-axis pull request review with OpenAI-compatible models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography", "rfc8785"]

[project.optional-dependencies]
tee = ["dstack-sdk"]

[project.scripts]
axis-review = "axis_review.cli:main"

[tool.setuptools]
packages = ["axis_review"]
