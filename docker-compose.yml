services:
  axis-review:
    image: python:3.12
    platform: linux/amd64
    environment:
      PHALA_API_KEY: ${PHALA_API_KEY}
      AXIS_REVIEW_SERVE_TOKEN: ${AXIS_REVIEW_SERVE_TOKEN}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AXIS_REVIEW_REF: ${AXIS_REVIEW_REF}
      PR_URLS: ${PR_URLS}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - review-data:/data/out
    ports:
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    command:
      - bash
      - -ec
      - |
        if ! [[ "$${AXIS_REVIEW_REF:-}" =~ ^[0-9a-fA-F]{40}$$ ]]; then
          printf '%s\n' 'Set AXIS_REVIEW_REF to a full 40-hex commit SHA' >&2
          exit 1
        fi
        : "$${AXIS_REVIEW_SERVE_TOKEN:?Set AXIS_REVIEW_SERVE_TOKEN to a secret access token}"
        : "$${PR_URLS:?Set PR_URLS to space-separated GitHub pull request URLs}"
        ref="$$(printf '%s' "$$AXIS_REVIEW_REF" | tr 'A-F' 'a-f')"
        source="$$(mktemp -d)"
        git init "$$source"
        git -C "$$source" fetch --depth 1 https://github.com/GGGODLIN/axis-review "$$ref"
        git -C "$$source" checkout --detach FETCH_HEAD
        check_ref() {
          if [[ "$$(git -C "$$source" rev-parse HEAD)" != "$$ref" ]]; then
            printf '%s\n' 'Checked-out commit does not match AXIS_REVIEW_REF' >&2
            exit 1
          fi
        }
        check_ref
        python -m pip install 'dstack-sdk==0.6.0' -e "$$source[tee]"
        check_ref
        read -r -a pr_urls <<< "$$PR_URLS"
        status=0
        axis-review review "$${pr_urls[@]}" --config "$$source/config.phala.toml" --out /data/out || status=$$?
        # Serve even when one PR fails: the other PRs' reports and the failed PR's diagnostics are only retrievable here.
        printf 'axis-review review exited with status %s\n' "$$status" >&2
        exec axis-review serve /data/out --host 0.0.0.0 --port 8080

volumes:
  review-data:
